<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aegis Practitioner Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&family=Nunito:wght@400;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
/* DESIGN.md · Apothecary. Clinical. Unhurried. */
:root{--navy:#1C3140;--amber:#7A6243;--bronze:#A7895F;--bink:#7A6243;--paper:#fff;--mist:#EEF1F4;--mist2:#E5EAEF;--slate:#5B6872;--hair:#E4E8EC;--hair2:#C9D0D6;
 --f:Calibri,Carlito,'Segoe UI',Candara,sans-serif;--muted:var(--slate);--line:var(--hair);--field:var(--hair2);--r:20px;--r-sm:12px;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--paper);color:var(--navy);font-family:var(--f);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1}
h1 em,h2 em,h3 em,.vt em{font-style:italic;color:var(--bink)}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.sub{color:var(--slate)}.small{font-size:15px}.tiny{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.hidden{display:none!important}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}

/* Capsule nav + sequence rail */
.navshell{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:14px 16px 6px;background:linear-gradient(#fff 70%,rgba(255,255,255,0))}
.capsule{max-width:1152px;margin:0 auto;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:32px;padding:8px 8px 8px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 0 0 1px var(--hair)}
#brandmark{display:flex;align-items:center}#brandmark img{height:34px;width:auto}
.gnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}.gnav::-webkit-scrollbar{display:none}
.gnav a{font-size:16px;font-weight:700;color:var(--slate);padding:8px 12px;border-radius:999px;white-space:nowrap}
.gnav a:hover,.gnav a.on{color:var(--navy)}
.gnav a.on{background:var(--mist)}
.me{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--slate);padding:0 6px;white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;background:var(--mist);color:var(--navy);display:grid;place-items:center;font-size:13px;font-weight:700}
.rail{max-width:1152px;margin:10px auto 0;position:relative;height:34px}
.rail .line{position:absolute;left:22px;right:22px;top:9px;height:2px;background:var(--hair);border-radius:2px;overflow:hidden}
.rail .fill{position:absolute;inset:0;background:var(--navy);transform-origin:left;transform:scaleX(var(--p,0))}
.rail .mark{position:absolute;top:4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--slate);transform:translateX(-50%)}
.rail .mark i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--navy)}
.rail .mark.lit{color:var(--amber)}.rail .mark.lit i{box-shadow:inset 0 0 0 6px var(--amber)}
.rail .you{position:absolute;top:2px;left:calc(22px + (100% - 44px) * var(--you,.62));width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px #fff;transform:translateX(-50%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border-radius:128px;padding:10px 22px;font-size:16px;font-weight:700;border:0;cursor:pointer;white-space:nowrap;min-height:44px}
.btn.amber{background:var(--amber)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--hair2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.sm{min-height:38px;padding:7px 18px;font-size:15px}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--bronze);outline-offset:3px}
@media(max-width:860px){.gnav,.me .who{display:none}.capsule{justify-content:space-between}.rail .mark{font-size:11px}}

/* Hero field */
.hero{margin:-62px 16px 0;border-radius:32px;background:linear-gradient(var(--mist),#fff 94%);padding:150px 24px 88px;text-align:center}
.hero h1{font-size:clamp(42px,6.6vw,80px);max-width:16ch;margin:0 auto;text-wrap:balance}
.hero .lead{color:var(--slate);font-size:clamp(18px,2vw,23px);line-height:1.3;max-width:620px;margin:22px auto 0}
.hero.compact{padding:128px 24px 48px}.hero.compact h1{font-size:clamp(32px,4.4vw,48px);max-width:22ch}.hero.compact .lead{font-size:18px;margin-top:14px}
.hero .cta{margin-top:36px}
.access{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:26px;font-size:15px;font-weight:700}
.access span{display:inline-flex;align-items:center;gap:8px}
.access span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bronze)}
.access .prog{color:var(--amber)}.access .prog::before{background:var(--amber)}
.byline{display:inline-flex;align-items:center;gap:14px;margin-top:40px;text-align:left}
.byline p{font-size:15px;color:var(--slate);line-height:1.35}.byline strong{color:var(--navy)}
.avatars{display:flex}.avatars img,.avatars .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #fff}
.avatars>*+*{margin-left:-12px}
.ph{display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-size:14px}.avatars .ph+.ph{background:var(--bink)}
.proof{text-align:center;padding:48px 24px 0}
.proof h3{font-size:24px;letter-spacing:-.01em}
.proof ul{list-style:none;padding:0;margin:18px 0 0;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 44px;font-size:17px;font-weight:700;color:var(--slate)}

/* Tabs */
.tabbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-top:48px;border-bottom:1px solid var(--hair)}
.tabbar.top{margin-top:8px}
.tabs{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;font-size:17px;font-weight:700;color:var(--slate);padding:16px 0 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--navy)}.tabs a.on{color:var(--navy);border-color:var(--navy)}
@media(max-width:860px){.tabbar{position:static}}
.tabbody{padding-bottom:40px}
.opener2{padding:64px 0 8px;max-width:760px}
.opener2 h2{font-size:clamp(34px,4.6vw,56px)}
.opener2 .cnt{font-size:.45em;color:var(--slate);letter-spacing:0;vertical-align:.55em;font-weight:700}
.opener2 p{color:var(--slate);font-size:clamp(18px,1.8vw,21px);line-height:1.35;margin-top:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:32px 0 20px;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--mist);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--slate);cursor:pointer}
.tb.on,.tb:hover{color:var(--navy);background:var(--mist2)}
.tbgroup{display:inline-flex;gap:4px}
select.tb{appearance:auto;border:0}

/* Cards */
.cards{display:grid;gap:24px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:960px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--hair);border-radius:var(--r);display:flex;flex-direction:column;min-height:240px;transition:border-color .2s;overflow:hidden}
a.card:hover{border-color:var(--hair2)}
.card.feat{grid-column:span 2;background:var(--navy);border-color:var(--navy);color:#fff}
.card.feat .ctitle{font-size:clamp(28px,3vw,40px)}
.card.feat .cdesc,.card.feat .meta{color:#C9D3DA}.card.feat .kick{color:var(--bronze)}
.card.feat .done{color:#C9D3DA}.card.feat .box{background:transparent;box-shadow:inset 0 0 0 1.5px #6E8292}.card.feat .done.on .box{background:var(--amber);box-shadow:none}
@media(max-width:620px){.card.feat{grid-column:auto}}
.card.prodcard{border:0;border-radius:0;background:none;min-height:0}
.card.prodcard .cbody{padding:18px 2px 0}
.pthumb{position:relative;aspect-ratio:4/5;background:var(--mist);border-radius:24px;overflow:hidden;transition:background .3s}
a.card:hover .pthumb{background:var(--mist2)}
.pthumb img,.pthumb svg{position:absolute;inset:16% 14%;width:72%;height:68%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(28,49,64,.18))}
.cbody{padding:26px;display:flex;flex-direction:column;flex:1}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.kick{font-size:14px;font-weight:700;color:var(--bink)}
.cat{font-size:14px;font-weight:700;color:var(--bink)}
.ctitle{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.prodcard .ctitle{font-size:28px}
.cdesc{font-size:16px;color:var(--slate);margin-top:10px;flex:1}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--slate);margin-top:22px}
.meta .ico{display:none}
.done{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--slate);cursor:pointer;user-select:none;background:none;border:0;padding:0}
.box{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px #B8C1C9;position:relative;flex:none}
.done.on .box{background:var(--navy);box-shadow:none}
.done.on .box::after{content:"";position:absolute;left:5px;top:3px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.grouph{font-size:clamp(28px,3.4vw,40px);margin:72px 0 20px}

/* List rows */
.group{margin-top:8px;border-top:1px solid var(--hair)}
.ghead{display:flex;align-items:center;gap:10px;padding:20px 0 12px;font-weight:700;font-size:20px;cursor:pointer;background:none;border:0;width:100%;text-align:left;letter-spacing:-.01em}
.ghead .ico:not(.chev){display:none}
.ghead .n{font-size:14px;color:var(--slate);font-weight:700}
.ghead .chev{transition:transform .2s;color:var(--slate)}.ghead.closed .chev{transform:rotate(-90deg)}
.lrow{display:grid;grid-template-columns:22px 64px 1fr auto;gap:18px;align-items:center;padding:14px 12px;border-radius:16px}
.lrow:hover{background:var(--mist)}
.lthumb{width:64px;height:64px;border-radius:14px;background:var(--mist);display:grid;place-items:center;overflow:hidden}
.lthumb svg{width:50%;height:50%}.lthumb img{width:78%;height:78%;object-fit:contain}
.lthumb .big{width:40%;height:40%}
.ltitle{font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;letter-spacing:-.01em}
.vchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--slate)}
.ptag{font-size:13px;font-weight:700;color:var(--bink)}
.ldesc{font-size:15px;color:var(--slate);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{font-size:13px;color:var(--slate);text-align:right;white-space:nowrap}
@media(max-width:700px){.lrow{grid-template-columns:22px 52px 1fr}.lmeta{display:none}.lthumb{width:52px;height:52px}}

/* Fields */
label.f{display:block;font-size:15px;font-weight:700;margin-bottom:8px}
input[type=text],select,textarea{width:100%;background:#fff;border:1px solid var(--hair2);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(167,137,95,.25)}
textarea{min-height:120px;resize:vertical}

/* Detail pages */
.dback .wrap{padding-top:4px;padding-bottom:8px}
.dback a{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--slate)}
.dback a:hover{color:var(--navy)}
.banner{margin:0 16px;border-radius:32px;background:linear-gradient(var(--mist),#F6F8FA)}
.banner .wrap{padding:64px 32px;display:flex;justify-content:space-between;align-items:center;gap:40px}
.spill{display:block;font-size:15px;font-weight:700;color:var(--bink)}
.spill b{font-weight:700}.spill span::before{content:" · ";color:var(--slate)}
.banner h1{font-size:clamp(36px,5vw,64px);margin-top:14px;max-width:16ch}
.tline{display:block;font-size:.42em;font-style:italic;color:var(--bink);margin-top:14px;line-height:1.25;letter-spacing:-.01em}
.banner .byline{margin-top:32px}
.banner .art{width:300px;flex:none;aspect-ratio:4/5;position:relative}
.banner .art img,.banner .art svg{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(28,49,64,.2))}
@media(max-width:760px){.banner .art{display:none}.banner .wrap{padding:44px 22px}}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:64px;padding-top:40px;padding-bottom:40px}
@media(max-width:960px){.dgrid{grid-template-columns:1fr}.toc{display:none}}
.dmeta{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--slate)}
.dmeta span{display:flex;align-items:center;gap:6px}
.dact{display:flex;justify-content:space-between;gap:10px;margin:18px 0 32px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--hair)}
.toc{position:sticky;top:170px;align-self:start;font-size:15px}
.toc .h{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px}
.toc a{display:block;color:var(--slate);padding:6px 0 6px 14px;border-left:2px solid var(--hair);line-height:1.3}
.toc a:hover{color:var(--navy);border-color:var(--navy)}
.video{aspect-ratio:16/9;border-radius:24px;background:var(--navy);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:32px}
.video .vt{font-size:clamp(28px,3.4vw,44px);font-weight:700;line-height:1;max-width:12ch;letter-spacing:-.03em}.video .vt em{color:#CDB48C}
.video .play{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center}
.video .play svg{fill:var(--navy)}
.vrow{display:flex;align-items:center;gap:12px}.vrow .avatars img,.vrow .avatars .ph{border-color:var(--navy);width:38px;height:38px}
.video .vm{font-size:14px;color:rgba(255,255,255,.75)}
.dsec{padding-top:72px}
.dsec>h2{font-size:clamp(28px,3vw,40px);margin-bottom:18px;display:flex;gap:12px;align-items:center}
.dsec>h2 .ico{display:none}
details{border-bottom:1px solid var(--hair)}
summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:center;letter-spacing:-.01em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;font-weight:400;color:var(--slate);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details .in{padding:0 0 22px;color:var(--slate);max-width:64ch}
.ing{padding:20px 0;border-top:1px solid var(--hair)}.ing:first-child{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--slate)}
.tier{font-size:14px;font-weight:700;color:var(--bink)}
.safety{background:#F3EDE4;color:var(--navy);border-radius:20px;padding:24px 26px}
.safety b{color:#7A6243;font-size:17px}
.tip{background:var(--mist);border-radius:20px;padding:22px 24px;font-size:16px}
.tip strong{display:block;color:var(--bink);font-size:14px;margin-bottom:4px}
.panel{background:var(--mist);border-radius:24px;padding:32px}
.panel.tint{background:var(--mist)}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:#fff;border-radius:14px;padding:12px 16px;margin-top:8px;cursor:pointer;font-size:16px}
.qopt:hover{border-color:var(--hair2)}
.qopt.right{border-color:#1C3140;background:#E8EDF1;color:#1C3140}.qopt.wrong{border-color:#CDB48C;background:#F7F3ED;color:#7A6243}
.chap{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid rgba(28,49,64,.1);font-size:16px;cursor:pointer}.chap:first-child{border-top:0}.chap.on b{color:var(--amber)}

/* Ask */
.askbox{background:#fff;border-radius:999px;padding:6px 6px 6px 22px;display:flex;gap:8px;align-items:center;box-shadow:0 0 0 1px var(--hair2)}
.askbox:focus-within{box-shadow:0 0 0 2px var(--navy)}
.askbox input{border:0!important;box-shadow:none!important;padding:10px 0;background:none}
.try{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.try button{border:0;background:var(--mist);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--slate);cursor:pointer}
.try button .ico{display:none}.try button:hover{color:var(--navy);background:var(--mist2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--mist);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;color:var(--slate);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--hair)}
.thinking{display:flex;gap:12px;align-items:center;color:var(--slate);padding:10px 0}
.spin{width:18px;height:18px;border:2px solid var(--hair);border-top-color:var(--amber);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.phase{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:22px 0;border-top:1px solid rgba(28,49,64,.1)}
.num{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.prod{display:flex;gap:10px;padding:8px 0}.dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex:none}
.note{font-size:14px;color:var(--bink)}

/* Builder and tools */
.grid{display:grid;gap:24px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:820px){.g2{grid-template-columns:1fr}}
.sec{padding:32px 0}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.picks button{display:inline-flex;align-items:center;gap:8px;border:0;background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;color:var(--slate);cursor:pointer;box-shadow:0 0 0 1px var(--hair)}
.picks button i{width:8px;height:8px;border-radius:50%}.picks button.on{color:#fff;box-shadow:none}
.lint{font-size:14px;padding:10px 14px;border-radius:12px;margin-top:10px;background:#F3EDE4;color:#7A6243}.lint.ok{background:#E8EDF1;color:#1C3140}
.handout{background:#fff;color:#1C3140;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px var(--hair),0 24px 48px -24px rgba(28,49,64,.25)}
.handout .hd{padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}.handout .hd img{max-height:42px;max-width:160px;object-fit:contain}
.handout .bd{padding:24px 26px 6px}.handout .stg{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid #EDE7DD}
.handout .n2{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.handout .ft{margin:10px 26px 24px;padding:12px 14px;font-size:12px;color:#4F5E69;background:#F4F6F8;border-radius:12px}
.drop{border:1.5px dashed var(--hair2);border-radius:20px;padding:24px;text-align:center;cursor:pointer;background:#fff}
.swatch{width:44px;height:44px;border:1px solid var(--hair);border-radius:50%;padding:0;cursor:pointer;background:none;overflow:hidden}.swatch::-webkit-color-swatch-wrapper{padding:0}.swatch::-webkit-color-swatch{border:0;border-radius:50%}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findP=n=>Object.keys(P).find(k=>P[k].name.toLowerCase().replace('♀','')===String(n).toLowerCase().replace('♀',''));
const phaseOf=k=>PH.find(p=>p.k===k);
function art(id){const p=P[id],c=p.hex;
 if(p.shape==='tin')return `<svg viewBox="0 0 100 100"><rect x="18" y="14" width="64" height="72" rx="8" fill="${c}"/><rect x="18" y="14" width="64" height="12" rx="6" fill="#1C3140" opacity=".85"/><rect x="28" y="40" width="44" height="3" rx="1.5" fill="#fff" opacity=".85"/><rect x="28" y="48" width="30" height="3" rx="1.5" fill="#fff" opacity=".6"/></svg>`;
 if(p.shape==='pump')return `<svg viewBox="0 0 100 100"><rect x="45" y="6" width="22" height="6" rx="2" fill="#1C3140"/><rect x="47" y="12" width="8" height="12" fill="#1C3140"/><rect x="40" y="22" width="22" height="10" rx="3" fill="#1C3140"/><rect x="30" y="32" width="42" height="60" rx="10" fill="${c}"/><rect x="38" y="52" width="26" height="3" rx="1.5" fill="#fff" opacity=".85"/><rect x="38" y="60" width="18" height="3" rx="1.5" fill="#fff" opacity=".6"/></svg>`;
 return `<svg viewBox="0 0 100 100"><rect x="22" y="12" width="56" height="14" rx="4" fill="#1C3140"/><rect x="18" y="26" width="64" height="64" rx="12" fill="${c}"/><rect x="28" y="50" width="44" height="3" rx="1.5" fill="#fff" opacity=".85"/><rect x="28" y="58" width="30" height="3" rx="1.5" fill="#fff" opacity=".6"/></svg>`}
function brandFont(f){return f==='Carlito'?"Calibri,Carlito,sans-serif":`'${f}',Georgia,serif`}
function lintTitle(t){const h=BANNED.filter(w=>t.toLowerCase().includes(w));return h.length?`<div class="lint">“${esc(h.join('”, “'))}” reads as a condition or treatment word on something patients see. Try a title about the goal instead.</div>`:`<div class="lint ok">Patient-safe title.</div>`}
const check='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
/* ---------- Handout ---------- */
function handout(rm){
 const b=S.brand,co=b.mode==='co',primary=co?b.primary:'#1C3140',accent=co?b.accent:'#A7895F',font=co?brandFont(b.font):'Calibri,Carlito,sans-serif';
 const head=co?`<div>${b.logo?`<img src="${b.logo}" alt="">`:`<div style="font-family:${font};font-size:22px;color:#fff">${esc(b.practice||'Your practice')}</div>`}</div><div style="font-size:13px;color:rgba(255,255,255,.8);text-align:right;line-height:1.3">Formulas by<br><b style="color:#fff;font-size:15px">Aegis Formulas</b></div>`
  :`<div style="color:#fff;font-weight:700;font-size:20px">Aegis Formulas</div><div style="font-size:14px;color:#CDB48C">Well-being elevated</div>`;
 const st=PH.map((r,i)=>{const ids=rm.stages[r.k]||[];if(!ids.length)return'';return `<div class="stg"><div class="n2" style="background:${accent}">${i+1}</div><div><div style="font-weight:700;font-size:18px;font-family:${font}">Phase ${i+1}: ${r.n}</div>${ids.map(id=>`<div style="display:flex;gap:8px;font-size:15px;margin:4px 0"><span style="width:8px;height:8px;border-radius:50%;background:${P[id].hex};flex:none;margin-top:7px"></span><span><b>${P[id].name}</b>. ${P[id].line}</span></div>`).join('')}</div></div>`}).join('');
 return `<div class="handout"><div class="hd" style="background:${primary}">${head}</div><div class="bd" style="font-family:${co?font:'Calibri,Carlito,sans-serif'}">
  <div style="font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:700;font-family:${font}">${esc(rm.title)}</div>
  <div style="font-size:15px;color:#4F5E69;margin-bottom:6px">A simple plan, in the right order. You move to the next phase when your practitioner says you’re ready, not on a calendar.</div>${st}
  ${rm.pnotes?`<div style="margin:6px 0 10px;padding:14px 16px;background:#F7F3ED;border-radius:10px;font-size:15px"><b>A note from your practitioner</b><br>${esc(rm.pnotes)}</div>`:''}
  <div style="font-size:14px;color:#4F5E69;padding:6px 0 4px"><b>How much and when:</b> follow your practitioner’s directions.</div></div>
  <div class="ft">${co?esc(b.practice)+'. Formulas by Aegis Formulas. ':''}These statements have not been evaluated by the Food and Drug Administration. These products are not intended to diagnose, treat, cure, or prevent any disease. Use under the guidance of your practitioner. Talk to them first if you are pregnant, breastfeeding, or taking medication.</div></div>`}

function toolRoadmap(){const rm=S.roadmap;return `<section class="sec"><div class="wrap">

  <div class="card"><label class="f" for="pnotes">A note to your patient (optional)</label><textarea id="pnotes" placeholder="We’ll add one new formula every few days so we can see how you feel with each.">${esc(rm.pnotes)}</textarea></div>

  <div id="hpv">${handout(rm)}</div><div class="row noprint" style="margin-top:18px"><button class="btn" data-act="print">Print or save as PDF</button></div></div>
 </div></div></section>`}
function toolAssess(){const sc={P1:0,P2:0,P3:0},max=6;ASSESS.forEach((q,i)=>sc[q[0]]+=S.assess[i]||0);const done=Object.keys(S.assess).length===ASSESS.length;
 const start=done?PH.find(p=>sc[p.k]>=3)||PH[0]:null;
 return `<section class="sec"><div class="wrap"><div class="grid g2" style="align-items:start">
 <div class="card"><h3>Patient preview</h3><p class="sub small" style="margin-top:6px">What your patient answers, in your branding. 0 is never, 3 is most days. Sample questions for review.</p>
  ${ASSESS.map((q,i)=>`<div style="padding:16px 0;border-top:1px solid var(--border);margin-top:${i?0:14}px"><b>${q[1]}</b><div class="scale">${['Never','Sometimes','Often','Most days'].map((l,j)=>`<button data-as="${i}|${j}" class="${S.assess[i]===j?'on':''}">${l}</button>`).join('')}</div></div>`).join('')}</div>
 <div style="position:sticky;top:96px" class="grid">
  <div class="card"><h3>Practitioner view</h3><p class="sub small" style="margin-top:6px">Only you see the scoring and the suggested phase.</p>
   <div class="bars" style="margin-top:18px">${PH.map((p,i)=>`<div><div class="lbl"><span>Phase ${i+1}: ${p.n}</span><span>${sc[p.k]} / ${max}</span></div><div class="progress"><i style="width:${sc[p.k]/max*100}%"></i></div></div>`).join('')}</div>
   ${start?`<div class="tip" style="margin-top:20px"><strong>Suggested starting phase</strong>Phase ${PH.indexOf(start)+1}: ${start.n}. Re-run in 30 days to see the change.</div><div class="row" style="margin-top:14px"><button class="btn sm" data-act="astart">Build a roadmap from this</button></div>`:'<p class="note" style="margin-top:18px">Answer all six to see a suggested starting phase.</p>'}</div>
  <div class="tip"><strong>Decision for the team</strong>Store identifiable answers (needs a HIPAA setup), or score on your side and keep only de-identified results.</div>
 </div></div></div></section>`}

function handleMeals(d,e){const mp=S.mp;const r=()=>{saveMP();keepY(render)};
 if(d.mstyle){const i=mp.styles.indexOf(d.mstyle);i>-1?mp.styles.splice(i,1):mp.styles.push(d.mstyle);if(!mp.styles.length)mp.styles=['Baseline'];r();return true}
 if(d.mmeals){mp.meals=+d.mmeals;r();return true}if(d.mtime){mp.time=d.mtime;r();return true}if(d.mppl){mp.people=+d.mppl;r();return true}
 if('mmac' in d){mp.macros=!mp.macros;saveMP();return true}
 if(d.mavoid){const i=mp.avoid.indexOf(d.mavoid);i>-1?mp.avoid.splice(i,1):mp.avoid.push(d.mavoid);r();return true}
 if(d.mstep){const n=$('#mpn');if(n)mp.name=n.value.trim();mp.step=Math.max(0,Math.min(3,mp.step+ +d.mstep));r();return true}
 if(d.mday){mp.day=+d.mday;r();return true}
 if(d.gopen){S.guideOpen=S.guideOpen===d.gopen?null:d.gopen;keepY(render);return true}
 if(d.gsend){S.sentGuides=S.sentGuides.filter(x=>x.id!==d.gsend);S.sentGuides.unshift({id:d.gsend,note:$('#gnote')?.value||''});saveMP();toast('Guide sent. Switch to Patient view → Learn to see it.');return true}
 if(d.mealfrom){S.mp={...S.mp,styles:[d.mealfrom],step:1,plan:null};S.tab.practice='meals';saveMP();location.hash='practice';render();return true}
 if(d.act==='mgen'){mp.plan=genPlan(mp);mp.day=0;r();toast('7-day plan built');return true}
 if(d.act==='mreset'){S.mp={step:0,name:'',styles:['Baseline'],meals:3,time:'30 min',people:1,macros:false,avoid:[],plan:null,day:0};r();return true}
 if(d.act==='msend'){S.sentMeal=JSON.parse(JSON.stringify(mp));saveMP();toast('Meal plan sent. See it in Patient view → My plan.');return true}
 return false}

 if(mp.step===2)body=`<label class="f">Meals per day</label><div class="seg">${[2,3].map(n=>`<button data-mmeals="${n}" class="${mp.meals===n?'on':''}">${n}</button>`).join('')}</div><label class="f" style="margin-top:18px">Time per meal</label><div class="seg">${['15 min','30 min','45+ min'].map(t=>`<button data-mtime="${t}" class="${mp.time===t?'on':''}">${t}</button>`).join('')}</div><label class="f" style="margin-top:18px">Cooking for</label><div class="seg">${[1,2,4].map(n=>`<button data-mppl="${n}" class="${mp.people===n?'on':''}">${n} ${n===1?'person':'people'}</button>`).join('')}</div><label class="priv" style="margin-top:18px"><input type="checkbox" data-mmac ${mp.macros?'checked':''}> Add macro targets</label>`;
 if(mp.step===3)body=`<div class="chips">${AVOID.map(s=>`<button class="chipb ${mp.avoid.includes(s)?'on':''}" data-mavoid="${s}">${s}</button>`).join('')}</div>`;
 return `<div class="bento"><div class="tile line b8"><div class="row between"><span class="kick2">Step ${mp.step+1} of 4 · ${steps[mp.step][0]}</span><div class="progress" style="width:160px;margin:0"><i style="width:${(mp.step+1)*25}%"></i></div></div><h3 style="font-size:30px;margin:12px 0 20px">${steps[mp.step][1]}</h3>${body}
  <div class="row between" style="margin-top:26px"><button class="btn ghost" data-mstep="-1" ${mp.step?'':'disabled'}>Back</button>${mp.step<3?'<button class="btn" data-mstep="1">Continue</button>':'<button class="btn amber" data-act="mgen">Build the 7-day plan</button>'}</div></div>
  <div class="tile b4"><span class="kick2">Aegis meal planner</span><h3 style="margin-top:8px">7 days, a grocery list, and a branded PDF</h3><p class="sub small" style="margin-top:8px">Built on the RWC planner Dr. Jaban uses in clinic, now in Aegis branding. Send it to a patient or print it.</p><p class="note2">Eating-style names are being reviewed so none read as a condition on patient-facing pages.</p></div></div>`}

function planView(mp,brand){const plan=mp.plan,day=plan[mp.day],gro=grocery(plan);const who=mp.name||'your client';
 const head=brand==='patient'?`<span class="kick2">From ${esc(S.brand.practice)}</span>`:`<span class="kick2">Aegis meal plan · ${esc(mp.styles.join(' + '))}</span>`;
 return `<div class="tile line" style="margin-top:22px;padding:0;overflow:hidden"><div style="background:var(--navy);color:#fff;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div>${head.replace('kick2','kick2" style="color:#CDB48C')}<h3 style="font-size:30px;color:#fff;margin-top:8px">7-day plan for ${esc(who)}</h3><p style="color:#C9D3DA;margin-top:4px">${mp.meals} meals a day · about ${mp.time} each · cooking for ${mp.people}${mp.avoid.length?' · no '+mp.avoid.join(', ').toLowerCase():''}</p></div>${brand==='patient'?'':`<img src="${IMG.logo}" alt="Aegis Formulas" style="height:40px;background:#fff;border-radius:10px;padding:6px 10px">`}</div>
 <div style="padding:22px 28px"><div class="chips">${DAYS.map((d,i)=>`<button class="chipb ${mp.day===i?'on':''}" data-mday="${i}">${d}</button>`).join('')}</div>
 <div class="bento" style="margin-top:18px">${day.map(m=>`<div class="tile b4"><span class="kick2">${m[0]} · ${m[3]} min</span><h3 style="font-size:19px;margin-top:8px">${m[1]}</h3><p class="sub small" style="margin-top:8px">${m[2].join(' · ')}</p></div>`).join('')}</div>
 <div class="bento"><div class="tile b7"><h3>Grocery list</h3><div class="chips" style="margin-top:12px">${gro.map(([g,n])=>`<span class="st">${g}${n>1?' ×'+n:''}</span>`).join('')}</div></div>
 <div class="tile b5"><h3>Notes</h3><p class="sub small" style="margin-top:8px">Cook once, eat twice: Tuesday’s slow-cooker beef covers Wednesday lunch. ${mp.macros?'Macro targets are on each day page in the PDF.':''}</p></div></div>
 ${brand==='patient'?'':`<div class="row" style="margin-top:22px"><button class="btn amber" data-act="msend">Send to patient</button><button class="btn ghost" data-act="soon">Download PDF</button><button class="btn ghost" data-act="mreset">Start over</button></div>`}</div></div>`}

function guideFull(g,brand){return `<div class="tile line" style="padding:0;overflow:hidden"><div style="padding:26px 28px;background:var(--mist)"><span class="kick2">${g.kind} · Phase ${PH.findIndex(p=>p.k===g.phase)+1}, ${phaseOf(g.phase).n}</span><h3 style="font-size:30px;margin-top:8px">${g.title}</h3><p class="sub" style="margin-top:10px;max-width:60ch">${g.why}</p></div>
 <div style="padding:8px 28px 26px"><div class="wsec"><h3>This week, do this</h3>${g.week.map((w,i)=>`<div class="check"><span class="cnum">${i+1}</span><div><b>${w}</b></div></div>`).join('')}</div>
 <div class="wsec"><h3>Easy swaps</h3>${g.swaps.map(s=>`<div class="pline"><span class="sub" style="flex:1;text-decoration:line-through">${s[0]}</span><b style="flex:1">${s[1]}</b></div>`).join('')}</div>
 <div class="wsec"><h3>What to expect</h3><div class="bento" style="margin-top:6px">${g.expect.map(x=>`<div class="tile b6"><b>${x[0]}</b><p class="sub small" style="margin-top:6px">${x[1]}</p></div>`).join('')}</div></div>
 <div class="wsec"><h3>Call your practice if</h3><ul class="sub" style="margin:6px 0 0;padding-left:20px">${g.call.map(c=>`<li style="margin:4px 0">${c}</li>`).join('')}</ul></div>
 ${g.meal?`<div class="tip" style="margin-top:8px"><strong>Pairs with a meal plan</strong>${brand==='patient'?'Ask your practitioner for a matching 7-day plan.':`<button class="btn sm" style="margin-top:8px" data-mealfrom="${g.meal}">Build a ${g.meal} meal plan</button>`}</div>`:''}
 <p class="note2" style="margin-top:16px">Educational, not medical advice. Follow your practitioner’s directions.</p></div></div>`}

function guidesTab(){const g=GUIDES.find(x=>x.id===S.guideOpen);
 return `<p class="plead" style="margin-top:24px">Practical guides patients actually use: a checklist for this week, easy swaps, what to expect, and when to call. Send them in your brand or Aegis’s.</p>
 <div class="bento">${GUIDES.map(x=>`<button class="tile ${S.guideOpen===x.id?'dark':'line'} b3g" data-gopen="${x.id}" style="text-align:left;border:0;cursor:pointer;grid-column:span 3"><span class="kick2">${x.kind} · ${phaseOf(x.phase).n}</span><h3 style="font-size:19px;margin-top:8px;${S.guideOpen===x.id?'color:#fff':''}">${x.title}</h3></button>`).join('')}</div>
 ${g?`<div class="bento"><div class="b8">${guideFull(g,'pro')}</div><div class="b4"><div class="tile" style="position:sticky;top:130px"><h3>Send this guide</h3><p class="sub small" style="margin-top:6px">Choose a patient and add a note. It lands in their portal in your brand.</p><label class="f" style="margin-top:14px" for="gpat">Patient</label><select id="gpat">${PATIENTS.map(p=>`<option>${p[0]}</option>`).join('')}</select><label class="f" style="margin-top:14px" for="gnote">Your note</label><textarea id="gnote" style="min-height:80px" placeholder="Start with the first two items this week."></textarea><div class="row" style="margin-top:14px"><button class="btn amber" data-gsend="${g.id}">Send guide</button><button class="btn ghost" data-act="soon">Print</button></div></div></div></div>`:''}`}
route();railScroll();

</script>
</body>
</html>
